workflows:
  ios-release:
    name: VoltAsist iOS TestFlight Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: VoltAsist
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ersensen.voltasist
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "VoltAsist.xcodeproj"
        XCODE_SCHEME: "VoltAsist"
    scripts:
      - name: Generate Xcode Project via XcodeGen
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Apply code signing to Xcode project
        script: |
          xcode-project use-profiles
      - name: Build and Archive
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - ersenzekisen@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
